general:
    runs: 2 # VALIDATION (15 min: 2 x (300 + 150)). Experiment: 4 # Changing this will affect the stress load, (max_stress_time + wait_after_stress) * (this value) will be total time of experiments
    plot_results: true  # At the end, copy logs/ to results/<scenario>_<date> and generate the plots there
    # scripts_folder is detected automatically (the folder that holds main.py)

setup:
    rebuild_images: false # VALIDATION (experiment: true) If true, the images will be rebuilt before the experiments
    teastore_start_interval: 15  # VALIDATION (experiment: 60) # Seconds between starting each of the 7 TeaStore services

stressload:
    stressload_first: false # If true, the stressload will be executed before the sleep time
    max_stress_time: 300  # VALIDATION (experiment: 259200) # Time the stress will be running in seconds (default 259200s = 3 days)
    wait_after_stress: 150  # VALIDATION (experiment: 43200) #Time the script will wait until next stress period in seconds (default 43200 = 12h)

    min_lifecycle_runs: 3 # min number of lifecycle runs for each container
    max_lifecycle_runs: 5 # max number of lifecycle runs for each container

    min_qtt_containers: 5 # min number of containers that will be created and deleted on each lifecycle run
    max_qtt_containers: 10 # max number of containers that will be created and deleted on each lifecycle run
    port_offset: 100  # Each parallel batch uses host_port + port_offset + batch index

lifecycle:  # Start/stop of every container (stress load and lifecycle monitor)
    start_max_retries: 5  # Extra attempts to start a container that failed
    start_retry_delay: 2  # Seconds between those attempts
    # stop_timeout: 10  # "stop -t": seconds before the runtime kills the container. If omitted, the runtime default (10)

rejuvenation:
    enabled: true  # VALIDATION (experiment: false) # Applies the method below after each stress period
    # Methods are registered in src/rejuvenation.py (add a new one there with @register("name")):
    #   cleanup_keep_teastore: removes containers, images and unused volumes, keeping everything from TeaStore
    #   full_reset: old method, removes everything (TeaStore included) and starts TeaStore again
    method: "cleanup_keep_teastore"
    delay: 5  # Seconds to wait after the rejuvenation
    protected_images: ["descartesresearch/teastore"]  # Kept by cleanup_keep_teastore (substring of the image name)

monitoring:
    sleep_time: 15  # VALIDATION (experiment: 60) # Sleep time the machine data will be collected in seconds
    sleep_time_container_metrics: 60  # VALIDATION (experiment: 240) # Sleep time the machine data will be collected in seconds
    # disk_device: "vda"  # Disk monitored by iostat. If omitted, the disk that holds "/" is detected automatically
    pidstat_interval: 1  # Window (seconds) of each pidstat reading of a runtime process; subtracted from sleep_time
    process_retry_delay: 10  # Seconds between attempts while a monitored process does not exist yet (each attempt runs pgrep + pidstat + 2 cat)
    stap_max_attempts: 11  # How many times systemtap is (re)started if it exits
    stap_retry_delay: 30  # VALIDATION (experiment: 120) # Seconds to wait before restarting systemtap
    stap_overload_threshold: 650000000  # systemtap STP_OVERLOAD_THRESHOLD (ns of probe time per interval)
    stap_overload_interval: 1000000000  # systemtap STP_OVERLOAD_INTERVAL (ns)
    stop_grace: 3  # Seconds at the end for the readings in progress to finish
    processes:  # Host processes monitored with pidstat, one <name>.csv each. Matched with "pgrep -f" (any part of the command line)
        docker: [docker, dockerd, containerd, containerd-shim, runc, docker-proxy]  # Used when the runtime is Docker
        podman: [podman, conmon, cron, crun, systemd]  # Used when the runtime is Podman
        common: [java, postgres, beam.smp, initdb, mysqld]  # Workload (TeaStore and stress containers), with either runtime
    lifecycle_stop_timeout: 120  # Max seconds, at the end, waiting for the container the lifecycle monitor is measuring

energy:
    enable_rapl: false  # Intel RAPL (CPU/DRAM power). Needs an Intel CPU with RAPL support and the script running as root
    sleep_time_rapl: 1  # Interval (seconds) between RAPL power samples
    rapl_zones: ["package", "core", "uncore", "dram"]  # Which RAPL domains to monitor (matched by name substring). Remove entries you don't need.

    enable_smart_plug: false  # TP-Link Kasa/Tapo smart plug. Needs the "python-kasa" package (pip install python-kasa)
    sleep_time_smart_plug: 300  # Interval (seconds) between smart plug power samples
    smart_plug_ip: "192.168.0.1"  # Smart plug IP address on the local network
    smart_plug_username: "exemplo@email.com"  # Account e-mail registered on the plug
    smart_plug_password: "changeme"  # Account password registered on the plug

logging:  # What the collector shows in the terminal
    informative: true  # Progress and event messages. false = only warnings and errors
    debug: true  # VALIDATION (experiment: false) # Every command executed, with its duration and CPU time (very verbose)
    to_file: true  # Also writes logs/collector.log
    console: true  # Interactive terminal (type "help"): threads of each part, running commands, status, cost. Off automatically when stdin is not a terminal

containers:
  - name: postgres
    version: "16.4-bookworm"
    host_port: 5432
    port: 5432
    min_container_wait_time: 1
    max_container_wait_time: 10
    env:  # Optional: environment variables (docker run -e). The postgres image exits at once without a password
      POSTGRES_PASSWORD: "postgres"

  - name: redis
    version: "7.4.0-bookworm"
    host_port: 6380
    port: 6379
    min_container_wait_time: 1
    max_container_wait_time: 10

  - name: rabbitmq
    version: "4.0-rc-management"
    host_port: 5672
    port: 5672
    min_container_wait_time: 1
    max_container_wait_time: 10

  - name: nginx
    version: "1.27.1-bookworm"
    host_port: 8085
    port: 80
    min_container_wait_time: 1
    max_container_wait_time: 10
